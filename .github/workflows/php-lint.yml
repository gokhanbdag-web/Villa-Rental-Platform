name: PHP checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo
          tools: none
      - name: Lint all PHP files
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  installer-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: villa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo
          tools: none
      - name: Run router dispatch smoke test
        run: php tests/router-smoke.php
      - name: Run user role boundary smoke test
        run: php tests/auth-authorization-smoke.php
      - name: Run payment signature and secret security smoke tests
        run: php tests/payment-security-smoke.php
      - name: Run iyzico environment-aware checkout smoke tests
        run: php tests/iyzico-production-mode-smoke.php
      - name: Run manual bank transfer report workflow smoke tests
        run: php tests/manual-payment-report-smoke.php
      - name: Run villa detail booking flow smoke test
        run: php tests/property-detail-booking-smoke.php
      - name: Run homepage statistic settings smoke test
        run: php tests/homepage-stats-smoke.php
      - name: Run mobile footer layout smoke test
        run: php tests/footer-mobile-layout-smoke.php
      - name: Run mobile hero search prominence smoke test
        run: php tests/mobile-hero-search-smoke.php
      - name: Run mobile premium search placement smoke test
        run: php tests/mobile-premium-search-smoke.php
      - name: Run desktop and mobile destination autocomplete smoke test
        run: php tests/destination-autocomplete-smoke.php
      - name: Run hero video start persistence and playback smoke test
        run: php tests/hero-video-start-smoke.php
      - name: Run admin version display smoke test
        run: php tests/admin-version-display-smoke.php
      - name: Run system diagnostics UI and media logging smoke test
        run: php tests/system-diagnostics-smoke.php
      - name: Run WordPress-style blog CMS smoke test
        run: php tests/blog-cms-smoke.php
      - name: Run account mobile layout and demo reviews smoke test
        run: php tests/account-reviews-demo-smoke.php
      - name: Run shared live SEO analyzer smoke test
        run: php tests/seo-analyzer-smoke.php
      - name: Run admin blog responsive layout smoke test
        run: php tests/admin-blog-responsive-smoke.php
      - name: Run blog archive menu option smoke test
        run: php tests/navigation-blog-archive-smoke.php
      - name: Run SMTP message validation smoke test
        run: php tests/email-delivery-smoke.php
      - name: Run iCalendar parser and SSRF validation smoke tests
        run: php tests/ical-calendar-smoke.php
      - name: Run seasonal pricing precedence smoke tests
        run: php tests/seasonal-pricing-smoke.php
      - name: Run seasonal minimum-stay and weekday restriction smoke tests
        run: php tests/seasonal-stay-rules-smoke.php
      - name: Run booking time extras fee smoke tests
        run: php tests/booking-extras-smoke.php
      - name: Run browser-installer backend smoke test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: villa_test
          DB_USER: root
          DB_PASSWORD: root
        run: php tests/installer-smoke.php
